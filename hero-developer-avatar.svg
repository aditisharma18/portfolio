<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <linearGradient id="it-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#070b14"/>
            <stop offset="50%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#1e1b4b"/>
        </linearGradient>

        <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f2fe"/>
            <stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>

        <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7928ca"/>
            <stop offset="100%" stop-color="#c084fc"/>
        </linearGradient>

        <filter id="glow-drop" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Outer IT Cyber Ring Container -->
    <circle cx="250" cy="250" r="235" fill="url(#it-bg)" stroke="url(#cyan-blue)" stroke-width="3"/>
    <circle cx="250" cy="250" r="218" fill="none" stroke="url(#cyan-blue)" stroke-width="2" stroke-dasharray="12 18" opacity="0.75"/>
    <circle cx="250" cy="250" r="200" fill="none" stroke="url(#purple-glow)" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.6"/>

    <!-- Central IT Engineering Hub Figure -->
    <!-- Node 1: Cloud API Server -->
    <rect x="75" y="75" width="160" height="90" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="#00f2fe" stroke-width="2" filter="url(#glow-drop)"/>
    <circle cx="95" cy="95" r="5" fill="#00f2fe"/>
    <circle cx="110" cy="95" r="5" fill="#38bdf8"/>
    <text x="125" y="99" fill="#00f2fe" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">REST API Server</text>
    <rect x="95" y="115" width="120" height="8" rx="4" fill="rgba(0, 242, 254, 0.3)"/>
    <rect x="95" y="130" width="90" height="8" rx="4" fill="rgba(121, 40, 202, 0.4)"/>
    <text x="155" y="155" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">ASP.NET Core / C#</text>

    <!-- Node 2: Database Schema Figure -->
    <rect x="265" y="75" width="160" height="90" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="#ff0080" stroke-width="2" filter="url(#glow-drop)"/>
    <path d="M 285 95 C 285 90, 315 90, 315 95 C 315 100, 285 100, 285 95 Z M 285 95 L 285 110 C 285 115, 315 115, 315 110 L 315 95" fill="none" stroke="#ff0080" stroke-width="2"/>
    <text x="325" y="100" fill="#ff70a6" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">SQL Server DB</text>
    <text x="345" y="130" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="12" font-weight="700" text-anchor="middle">+30% Speedup</text>
    <text x="345" y="152" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">Query Optimization</text>

    <!-- Center Node: Full-Stack Developer Interface Figure -->
    <circle cx="250" cy="250" r="60" fill="rgba(15, 23, 42, 0.95)" stroke="url(#cyan-blue)" stroke-width="3" filter="url(#glow-drop)"/>
    <path d="M 225 240 L 210 250 L 225 260 M 275 240 L 290 250 L 275 260 M 255 235 L 245 265" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" fill="none"/>
    <text x="250" y="278" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">C++ / JS / Python</text>

    <!-- Connecting IT Data Streams -->
    <line x1="155" y1="165" x2="215" y2="210" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="345" y1="165" x2="285" y2="210" stroke="#ff0080" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="155" y1="335" x2="215" y2="290" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="345" y1="335" x2="285" y2="290" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Node 3: IoT Hardware Microcontroller Figure -->
    <rect x="75" y="335" width="160" height="90" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="#10b981" stroke-width="2" filter="url(#glow-drop)"/>
    <rect x="95" y="355" width="30" height="30" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="110" y="374" fill="#10b981" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">MCU</text>
    <text x="135" y="365" fill="#34d399" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">IoT ESP8266</text>
    <text x="155" y="395" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">Patent Published</text>
    <text x="155" y="410" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">Safety Innovation</text>

    <!-- Node 4: AI & ML Engine Figure -->
    <rect x="265" y="335" width="160" height="90" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="#f59e0b" stroke-width="2" filter="url(#glow-drop)"/>
    <circle cx="295" cy="365" r="6" fill="#f59e0b"/>
    <circle cx="315" cy="355" r="6" fill="#f59e0b"/>
    <circle cx="315" cy="375" r="6" fill="#f59e0b"/>
    <line x1="295" y1="365" x2="315" y2="355" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="295" y1="365" x2="315" y2="375" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="330" y="367" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">AI / ML Engine</text>
    <text x="345" y="395" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">Python Streamlit</text>
    <text x="345" y="410" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">Disease Predictor</text>

    <!-- Branding Banner Footer Tag -->
    <rect x="150" y="448" width="200" height="32" rx="16" fill="rgba(15, 23, 42, 0.95)" stroke="url(#cyan-blue)" stroke-width="1.5"/>
    <text x="250" y="469" fill="#00f2fe" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle">ADITI SHARMA • IT FIGURE</text>
</svg>
