<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
    <defs>
        <linearGradient id="iot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e1b4b"/>
            <stop offset="50%" stop-color="#431407"/>
            <stop offset="100%" stop-color="#070b14"/>
        </linearGradient>
    </defs>

    <rect width="600" height="340" rx="14" fill="url(#iot-bg)"/>

    <!-- IT Hardware Microcontroller Schematic Figure -->
    <rect x="220" y="80" width="160" height="150" rx="14" fill="#0f172a" stroke="#ff0080" stroke-width="3"/>
    <text x="300" y="115" fill="#ff70a6" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" text-anchor="middle">ESP8266 MCU FIGURE</text>
    
    <!-- Microchip Pinouts -->
    <rect x="200" y="100" width="20" height="10" rx="2" fill="#00f2fe"/>
    <rect x="200" y="125" width="20" height="10" rx="2" fill="#00f2fe"/>
    <rect x="200" y="150" width="20" height="10" rx="2" fill="#00f2fe"/>
    <rect x="200" y="175" width="20" height="10" rx="2" fill="#00f2fe"/>

    <rect x="380" y="100" width="20" height="10" rx="2" fill="#10b981"/>
    <rect x="380" y="125" width="20" height="10" rx="2" fill="#10b981"/>
    <rect x="380" y="150" width="20" height="10" rx="2" fill="#10b981"/>
    <rect x="380" y="175" width="20" height="10" rx="2" fill="#10b981"/>

    <!-- Integrated Shock Defense Circuitry Arc -->
    <path d="M 120 150 L 170 125 L 155 150 L 200 125" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 480 150 L 430 125 L 445 150 L 400 125" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- GPS Emergency Location Beacon Figure -->
    <g transform="translate(100, 60)">
        <circle cx="20" cy="20" r="25" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 4"/>
        <circle cx="20" cy="20" r="10" fill="#00f2fe"/>
        <text x="20" y="60" fill="#00f2fe" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">GPS Beacon</text>
    </g>

    <!-- KPI Metric Pill Banner -->
    <rect x="150" y="270" width="300" height="42" rx="21" fill="rgba(15, 23, 42, 0.95)" stroke="#ff0080" stroke-width="2"/>
    <text x="300" y="296" fill="#ff70a6" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="middle">40% FASTER ALERT • PATENT PUBLISHED</text>
</svg>
