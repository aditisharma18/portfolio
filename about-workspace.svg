<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
    <defs>
        <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0b0f19"/>
            <stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>
        <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f2fe"/>
            <stop offset="50%" stop-color="#7928ca"/>
            <stop offset="100%" stop-color="#ff0080"/>
        </linearGradient>
    </defs>

    <rect width="600" height="320" rx="16" fill="url(#arch-bg)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

    <!-- Header Bar Figure -->
    <rect width="600" height="42" rx="16" fill="rgba(15, 23, 42, 0.95)"/>
    <circle cx="25" cy="21" r="5" fill="#ff5f56"/>
    <circle cx="43" cy="21" r="5" fill="#ffbd2e"/>
    <circle cx="61" cy="21" r="5" fill="#27c93f"/>
    <text x="85" y="25" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">ENTERPRISE IT ARCHITECTURE & STACK FLOW FIGURE</text>

    <!-- IT Tier 1: Client Browser -->
    <g transform="translate(30, 75)">
        <rect width="140" height="95" rx="10" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="2"/>
        <path d="M 50 30 L 35 45 L 50 60 M 90 30 L 105 45 L 90 60" stroke="#00f2fe" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <text x="70" y="22" fill="#00f2fe" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle">CLIENT TIER</text>
        <text x="70" y="78" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">HTML5 / CSS3 / JS</text>
    </g>

    <path d="M 170 122 L 225 122" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="4 4"/>
    <polygon points="225,117 235,122 225,127" fill="#00f2fe"/>

    <!-- IT Tier 2: Application Server -->
    <g transform="translate(235, 75)">
        <rect width="140" height="95" rx="10" fill="rgba(121, 40, 202, 0.15)" stroke="#7928ca" stroke-width="2"/>
        <rect x="35" y="30" width="70" height="30" rx="4" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
        <text x="70" y="49" fill="#c084fc" font-family="'Fira Code', monospace" font-size="10" font-weight="700" text-anchor="middle">C# REST API</text>
        <text x="70" y="22" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle">APPLICATION TIER</text>
        <text x="70" y="78" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">ASP.NET Core MVC</text>
    </g>

    <path d="M 375 122 L 430 122" stroke="#7928ca" stroke-width="2.5" stroke-dasharray="4 4"/>
    <polygon points="430,117 440,122 430,127" fill="#7928ca"/>

    <!-- IT Tier 3: Database Storage -->
    <g transform="translate(440, 75)">
        <rect width="130" height="95" rx="10" fill="rgba(255, 0, 128, 0.12)" stroke="#ff0080" stroke-width="2"/>
        <path d="M 45 28 C 45 22, 85 22, 85 28 C 85 34, 45 34, 45 28 Z M 45 28 L 45 50 C 45 56, 85 56, 85 50 L 85 28" fill="none" stroke="#ff0080" stroke-width="2"/>
        <text x="65" y="18" fill="#ff70a6" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle">DATA TIER</text>
        <text x="65" y="68" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">SQL Server</text>
        <text x="65" y="83" fill="#34d399" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">+30% Query Speed</text>
    </g>

    <!-- IT Tier 4: Hardware & ML Engine Sub-System -->
    <g transform="translate(80, 205)">
        <rect width="440" height="85" rx="10" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="2"/>
        <text x="220" y="30" fill="#34d399" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="middle">HARDWARE & MACHINE LEARNING INTEGRATION FIGURE</text>
        <rect x="40" y="42" width="160" height="30" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
        <text x="120" y="61" fill="#34d399" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">ESP8266 IoT Safety (Patent)</text>

        <rect x="240" y="42" width="160" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
        <text x="320" y="61" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Streamlit ML Predictive AI</text>
    </g>
</svg>
